name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Least privilege at the top level. None of these three jobs writes anything: lint and test
# read the tree, and docker-build loads the image locally (`push: false`) rather than pushing
# it. release.yml is where `packages: write` lives, scoped to the one job that needs it.
#
# Absent, GITHUB_TOKEN defaults to the repository's permissive setting, which is what OSSF
# Scorecard's Token-Permissions check scored searxng-mcp 0/10 for.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # Action versions are pinned to commit SHAs per repo-standards (not floating tags).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.0
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=vikunja_mcp --cov-report=term-missing

  # DEPENDENCY AUDIT — three gates, not one.
  #
  # They fail for different reasons and want different responses. A RUNTIME advisory affects
  # every deployment that pulls the image; a DEV advisory affects only this repository's CI;
  # a CONTAINER advisory is what is actually shipping right now, which is not necessarily what
  # the lockfile says. Collapsing them into a single red makes the urgent case
  # indistinguishable from the routine one.
  #
  # EVERY GATE READS A PINNED SET. None of them re-resolves. `pip-audit -r` resolves
  # regardless of `--no-deps` (verified against pip-audit 2.10.1), so the intuitive
  # "freeze the deps, audit the freeze" rebuilds the exact defect this job exists to prevent.
  # vikunja#633 is the incident: an audit that re-resolved read green while the deployed
  # container ran four HIGH advisories. An audit that re-resolves reports on a tree that ships
  # nowhere.
  #
  # Two gotchas established on webhook-doorman and scoped-mcp, both of which apply here:
  #   - `--locked` does NOT read uv.lock. It wants a PEP 751 pylock.toml, which is what
  #     `uv export --format pylock.toml` produces.
  #   - `--strict` trips on the project's own entry, which uv emits as a `directory = {...}`
  #     with no version. `--no-emit-project` leaves it out.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # A committed lockfile with nothing checking its currency is not a pinned dependency
      # set, it is a stale file that looks like one. F5 tests only that uv.lock EXISTS; this
      # step is what makes that presence mean something. scoped-mcp measured the failure this
      # catches: a lock last touched two and a half months before pyproject.toml, missing a
      # declared dependency entirely — every check downstream would have audited an incomplete
      # set, and passed.
      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check

      # --all-extras --no-extra dev is exactly what the image installs: the Dockerfile runs
      # `pip install '.[telemetry]'`, so telemetry ships and must be audited as runtime.
      - name: Export runtime dependency set
        run: |
          uv export --frozen --no-emit-project \
            --all-extras --no-extra dev \
            --format pylock.toml -o pylock.runtime.toml

      - name: Export dev dependency set
        run: |
          uv export --frozen --no-emit-project \
            --extra dev \
            --format pylock.toml -o pylock.dev.toml

      # pip-audit's --locked wants a file named exactly pylock.toml in the directory it is
      # given, so each gate gets its own directory containing only that file. Auditing from the
      # repo root would let pip-audit see pyproject.toml and fall back to RESOLVING — the exact
      # behaviour this job exists to stop.
      - name: Audit runtime dependencies
        run: |
          mkdir -p .audit-runtime && cp pylock.runtime.toml .audit-runtime/pylock.toml
          uv tool run pip-audit --strict --locked .audit-runtime

      - name: Audit dev dependencies
        run: |
          mkdir -p .audit-dev && cp pylock.dev.toml .audit-dev/pylock.toml
          uv tool run pip-audit --strict --locked .audit-dev

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # Needed by the image audit gate below (`uv tool run pip-audit`), not by the build.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: vikunja-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Building proves the image assembles; it does not prove it runs. These two are the
      # cheapest checks that would have caught a broken entry point or a missing runtime
      # dependency, neither of which a successful build surfaces.
      - name: Smoke test — refuses to start with no VIKUNJA_URL
        run: |
          set +e
          out=$(docker run --rm vikunja-mcp:ci 2>&1)
          status=$?
          echo "$out"
          if [ $status -eq 0 ]; then
            echo "::error::server started without VIKUNJA_URL — the fail-closed default is gone"
            exit 1
          fi
          echo "$out" | grep -q "VIKUNJA_URL is not set" || {
            echo "::error::exited non-zero but not for the expected reason"; exit 1; }
      - name: Smoke test — /health serves unauthenticated, container reports healthy
        run: |
          docker run -d --name vikunja-mcp-ci -e VIKUNJA_URL=https://vikunja.invalid \
            -p 127.0.0.1:8501:8501 vikunja-mcp:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' vikunja-mcp-ci)" = "healthy" ] && break
            sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' vikunja-mcp-ci | grep -qx healthy || {
            echo "::error::container never became healthy"; docker logs vikunja-mcp-ci; exit 1; }
          # No Authorization header, and the body must stay free of config.
          body=$(curl -fsS http://127.0.0.1:8501/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          # `if grep` rather than `grep && exit 1`: the latter returns non-zero from the
          # compound when grep finds nothing, failing the step on the success path.
          if echo "$body" | grep -qi "vikunja.invalid\|token"; then
            echo "::error::/health echoed config — it is unauthenticated by design"
            exit 1
          fi
          docker rm -f vikunja-mcp-ci
      # THIRD AUDIT GATE — the container image, which is the artefact people actually pull.
      #
      # It lives here rather than in the `audit` job because the image already exists at this
      # point; rebuilding it there would double the build for no extra signal.
      #
      # This gate audits what is INSTALLED, not what was declared. The lockfile gates in the
      # `audit` job and this one can disagree, and when they do this one is right: a base-image
      # bump, a wheel resolved differently for linux/amd64, or a hand-edited Dockerfile all move
      # the shipped set without touching uv.lock.
      #
      # THE POPULATION ASSERTION BELOW IS NOT DEFENSIVE PADDING — IT IS THE GATE.
      # `pip-audit --strict --path <empty dir>` exits 0 and prints "No known vulnerabilities
      # found" (measured, pip-audit 2.10.1). So every way the extraction can silently produce
      # nothing — a moved venv, a Python minor bump renaming python3.13, a changed WORKDIR —
      # turns this step green while auditing thin air. Asserting the project's own dist-info was
      # present proves we extracted THIS image's venv rather than some other tree; the count
      # floor proves it was populated.
      #
      # vikunja_mcp's own dist-info is then removed before auditing: the package is deliberately
      # not published to PyPI (the name is namesquatted — see release.yml), so --strict would
      # abort with "Dependency not found on PyPI" and take the other 90 distributions with it.
      # Dropping one unpublishable entry keeps --strict meaningful for everything that can
      # actually carry an advisory.
      - name: Audit the dependencies actually installed in the image
        run: |
          set -euo pipefail
          sp=$(docker run --rm --entrypoint python vikunja-mcp:ci -c 'import site; print(site.getsitepackages()[0])')
          echo "image site-packages: $sp"
          cid=$(docker create vikunja-mcp:ci)
          mkdir -p image-site-packages
          docker cp "$cid:$sp/." image-site-packages/
          docker rm -f "$cid" >/dev/null

          # Control 1 — did we extract THIS project's venv, or an empty/foreign tree?
          if ! ls -d image-site-packages/vikunja_mcp-*.dist-info >/dev/null 2>&1; then
            echo "::error::extraction did not yield vikunja_mcp's dist-info — pip-audit --path would report a green audit of nothing"
            exit 1
          fi
          rm -rf image-site-packages/vikunja_mcp-*.dist-info

          # Control 2 — is the tree populated? 90 distributions at the time of writing.
          count=$(find image-site-packages -maxdepth 1 -name '*.dist-info' | wc -l)
          echo "distributions to audit: $count"
          if [ "$count" -lt 50 ]; then
            echo "::error::only $count distributions extracted, expected ~90 — the audit below would be vacuous"
            exit 1
          fi

          uv tool run pip-audit --strict --path image-site-packages

      - name: Verify the image runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id vikunja-mcp:ci -u)
          [ "$uid" != "0" ] || { echo "::error::image runs as root"; exit 1; }
          echo "runs as uid $uid"
