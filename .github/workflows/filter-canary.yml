name: Filter canary

# Runs tests/test_filter_canary.py against a throwaway Vikunja on the FLOATING `:latest`
# tag, which is the whole point: this server depends on undocumented filter behaviour
# (`index` filtering, `title like`, `description like`, `labels not in`, `id !=`), and an
# upstream change to any of it would otherwise surface as a tool quietly returning wrong or
# empty results rather than as a failure.
#
# Deliberately NOT part of the CI required for a merge. It tests a moving external target,
# so a red run here means "upstream moved, go look" — not "this pull request is bad".
# Wiring it into the merge gate would make an unrelated upstream release block every PR.

on:
  schedule:
    # Weekly, Mondays 06:00 UTC. Frequent enough to catch a `:latest` move well before a
    # `compose pull` reaches a deployment; rare enough to stay cheap.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    # Also on changes to the canary itself or the code whose assumptions it guards, so a
    # change to either is checked against a real instance before it lands.
    paths:
      - "tests/test_filter_canary.py"
      - "src/vikunja_mcp/contrib/duplicate_check.py"
      - ".github/workflows/filter-canary.yml"

permissions:
  contents: read

jobs:
  canary:
    name: Undocumented filter behaviour
    runs-on: ubuntu-latest
    steps:
      # Action versions are pinned to commit SHAs per repo-standards (not floating tags).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Start Vikunja (latest)
        run: |
          # GitHub's default shell is `bash -e`, so -u and -o pipefail are not on. The
          # token step below pipes curl into python, where a silent pipeline failure would
          # hand the canary an empty bearer and turn every assertion into an auth error.
          set -euo pipefail
          docker run -d --name vikunja-canary -p 127.0.0.1:3456:3456 \
            -e VIKUNJA_SERVICE_PUBLICURL=http://127.0.0.1:3456 \
            -e VIKUNJA_DATABASE_TYPE=sqlite \
            -e VIKUNJA_DATABASE_PATH=/tmp/vikunja.db \
            -e VIKUNJA_FILES_BASEPATH=/tmp/files \
            -e VIKUNJA_SERVICE_ENABLEREGISTRATION=true \
            -e VIKUNJA_SERVICE_SECRET=canarysecretcanarysecretcanarysecret \
            vikunja/vikunja:latest
          # The literal secret and the login password below are not credentials in any
          # meaningful sense: this instance is created empty inside an ephemeral runner,
          # holds only fixtures this job just made up, is bound to loopback, and is
          # destroyed with the runner. Generating them would imply a confidentiality this
          # container does not have. The derived JWT is still masked, since it appears in
          # step output where a real one might one day.
          # The image defaults its file storage to a directory it cannot create as the
          # runtime uid, so it exits 1 without the FILES_BASEPATH override above. Found by
          # running exactly this locally first.
          for _ in $(seq 1 60); do
            curl -sf --max-time 3 http://127.0.0.1:3456/api/v2/info >/dev/null && break
            sleep 1
          done
          curl -sf --max-time 5 http://127.0.0.1:3456/api/v2/info

      - name: Report the version under test
        run: |
          echo "Vikunja version: $(curl -s http://127.0.0.1:3456/api/v2/info | python -c 'import json,sys; print(json.load(sys.stdin)["version"])')"

      - name: Create a user and mint a token
        id: token
        run: |
          set -euo pipefail
          # /register is v1-only — it is absent from v2's spec and 404s there (checked
          # against v2.5.0). Everything else in this job is on v2; this one line is what
          # will need revisiting when upstream removes v1 at 4.0.
          curl -sf -X POST http://127.0.0.1:3456/api/v1/register \
            -H 'Content-Type: application/json' \
            -d '{"username":"canary","password":"canarypassword123","email":"canary@example.invalid"}' >/dev/null
          # Vikunja accepts the login JWT as a bearer token on the API, so no separate API
          # token has to be provisioned. Throwaway instance, throwaway credential.
          #
          # NOTE: a JWT carries the user's full permissions, where production forwards a
          # scoped API token. The canary therefore cannot catch a token-permission
          # regression — see vikunja#515, and the by-index case in the canary itself, which
          # is written to accept either outcome for exactly this reason.
          JWT=$(curl -sf -X POST http://127.0.0.1:3456/api/v2/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"canary","password":"canarypassword123"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$JWT"
          echo "jwt=$JWT" >> "$GITHUB_OUTPUT"

      - name: Run the canary
        env:
          VIKUNJA_CANARY_URL: http://127.0.0.1:3456
          VIKUNJA_CANARY_TOKEN: ${{ steps.token.outputs.jwt }}
        # -p no:cacheprovider keeps the runner from writing a cache dir it does not need.
        run: pytest tests/test_filter_canary.py -v -p no:cacheprovider

      - name: Vikunja logs on failure
        if: failure()
        run: docker logs vikunja-canary 2>&1 | tail -50
