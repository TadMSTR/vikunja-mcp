name: Verify routes

# Opt-in, deliberately NOT on the PR path. This probes a live Vikunja instance; keeping it
# off pull_request means a fork PR can never trigger it, and a job that is only meaningful
# against a configured host does not sit in the required-checks path pretending otherwise.
#
# runs-on: ubuntu-latest is correct — vikunja.helmforge.me is genuinely public (no Authentik
# forward-auth on its SWAG vhost, so Bearer-token API calls work), so a GitHub-hosted runner
# can reach it. No self-hosted runner is needed.
on:
  workflow_dispatch:
  schedule:
    # 04:15 UTC daily — after forge's own maintenance windows.
    - cron: "15 4 * * *"

jobs:
  verify-routes:
    name: Live router verb sweep
    runs-on: ubuntu-latest
    steps:
      # Action versions are pinned to commit SHAs per repo-standards (not floating tags).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install httpx
      - name: Probe every implemented route against the live Echo router
        env:
          # VIKUNJA_URL only — no token. Echo answers the route-mismatch 405 before auth
          # middleware runs (verified across all 69 routes with no Authorization header), so
          # this sweep needs no credential, and configuring one would add blast radius for
          # nothing. With the variable unset the script prints SKIP and exits 0.
          VIKUNJA_URL: ${{ secrets.VIKUNJA_URL }}
        run: python scripts/verify-routes.py
